# Pinned pre-commit chain. Tool versions match the `dev` extra in
# pyproject.toml (ruff 0.16.6, mypy 2.3.1) so local runs, the hook chain
# and CI all agree.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Strict typing is enforced for the library itself (src/); test
        # modules are exempt from annotations (see per-file-ignores) and
        # CI runs the full `mypy src` with all dependencies installed.
        files: ^src/
        # Runtime dependencies are installed into the hook environment so
        # numpy/scipy types resolve exactly like the full `mypy src` run
        # in CI (pyproject.toml: strict = true).
        additional_dependencies:
          - numpy>=1.24.0
          - scipy>=1.10.0
          - PyYAML>=6.0

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: local
    hooks:
      - id: repo-hygiene
        name: repository hygiene scanner (keywords / artifacts / paths / size)
        entry: python scripts/check_public_hygiene.py
        language: system
        types: [file]
        pass_filenames: true

      # README statistics gate (round-6 audit C12).  The test count, coverage
      # percentage and module count are quoted in four places in each of two
      # READMEs; `make stats` regenerates them, but nothing enforced that it
      # had been run -- both the round-5 and round-6 audits found the READMEs
      # advertising numbers from a release or two earlier.  This hook measures
      # the real values and fails if the committed text disagrees.
      #
      # It runs a full `pytest --cov` plus a `mypy` invocation (~100 s), so it
      # is a pre-push hook, not pre-commit: gating every single commit on a
      # two-minute re-measurement is how gates get disabled with --no-verify.
      # `pre-commit install --hook-type pre-push` (see `make pre-commit-setup`)
      # is required for it to fire.
      - id: readme-stats
        name: README statistics match the measured suite (make stats)
        entry: python scripts/update_readme_stats.py --check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
