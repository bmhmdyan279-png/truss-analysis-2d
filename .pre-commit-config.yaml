repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy و detect-secrets غیرفعال شدند (مشکل با Python 3.14)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.10.0
  #   hooks:
  #     - id: mypy

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # detect-secrets غیرفعال شد (نیاز به baseline file دارد)
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets

  - repo: local
    hooks:
      - id: no-hardcoded-strings
        name: Check for hardcoded strings in print/logger
        language: pygrep
        entry: '(print|logger\.(?:debug|info|warning|error|critical))\s*\(\s*["''][^"'']+["'']'
        files: \.py$
        exclude: ^tests/|^\.github/
        description: 'Prevents hardcoded strings in print or logger functions. Use localization instead.'
