[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "truss_analysis"
dynamic = ["version"]
description = "2D Truss Analysis Tool - scientifically validated"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arabic_reshaper",
    "python-bidi",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
    "scipy>=1.10.0",
    "scienceplots>=2.0.0", # Added for Phase 10/11 reproducibility (D-032)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
truss-analysis = "truss_analysis.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/truss_analysis/_version.py"
fallback_version = "2.1.6"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/truss_analysis --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
