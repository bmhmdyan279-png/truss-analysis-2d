[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truss_analysis"
version = "1.6.0"
description = "A professional 2D truss analysis engine with thermal and fabrication error effects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Behnam", email = "behnam@example.com" }]
keywords = ["structural-engineering", "truss", "finite-element", "2d", "mechanics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "matplotlib>=3.4",
  "pyyaml>=6.0",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.4"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.1.0", "build>=1.0", "twine>=4.0"]

[project.scripts]
truss-analyze = "truss_analysis.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N803", "N806", "N802", "UP006", "UP035", "SIM105", "SIM108", "SIM116", "SIM101"]

[tool.ruff.lint.isort]
known-first-party = ["truss_analysis"]

[tool.mypy]
python_version = "1.6.0"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "yaml", "arabic_reshaper", "pytest", "bidi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.coverage.run]
source = ["src/truss_analysis"]
omit = [
  "*/tests/*",
  "*/examples/*",
  "src/truss_analysis/main.py",
  "src/truss_analysis/fileio.py",
  "src/truss_analysis/postprocess.py"
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:"
]
fail_under = 70
show_missing = true

[tool.importlinter]
root_package = "truss_analysis"

[[tool.importlinter.contracts]]
name = "Domain isolation"
type = "forbidden"
source_modules = [
    "truss_analysis.domain",
]
forbidden_modules = [
    "truss_analysis.cli",
    "matplotlib",
    "rich",
]

[[tool.importlinter.contracts]]
name = "Localization independence"
type = "forbidden"
source_modules = [
    "truss_analysis.infrastructure.localization",
]
forbidden_modules = [
    "truss_analysis.solver",
]
