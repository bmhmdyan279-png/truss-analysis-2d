[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truss_analysis"
version = "2.0.9"
description = "2D Truss Analysis Tool"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=truss_analysis --cov-report=term-missing"
