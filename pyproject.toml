version = "1.6.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "N803",   # Argument name should be lowercase (engineering: K, F, E, A)
    "N806",   # Variable in function should be lowercase (engineering: K_global, F_f)
    "N802",   # Function name should be lowercase (engineering: test_element_delta_L_free)
    "UP006",  # Use dict instead of Dict (typing compatibility)
    "UP035",  # typing.Dict is deprecated (typing compatibility)
    "SIM105", # Use contextlib.suppress (style preference)
    "SIM108", # Use ternary operator (style preference)
    "SIM116", # Use dictionary instead of if-else (style preference)
    "SIM101", # Multiple isinstance calls (style preference)
]

[tool.ruff.lint.isort]
known-first-party = ["truss_analysis"]

[tool.mypy]
python_version = "1.6.0"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]



[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "yaml",
    "arabic_reshaper",
    "pytest"
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/truss_analysis"]
omit = [
    "src/truss_analysis/fileio.py",
    "src/truss_analysis/postprocess.py",
    "src/truss_analysis/main.py"
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
