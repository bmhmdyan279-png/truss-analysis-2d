[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "truss_analysis"
version = "2.0.1"
description = "2D Truss Analysis with fail-fast mechanics and golden tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "N", "B", "I", "UP"]
ignore = ["N806", "N803", "N815", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
