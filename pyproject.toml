[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truss-analysis-2d"
version = "1.4.0"
description = "A professional 2D truss analysis engine with thermal and fabrication error effects."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Behnam", email = "behnam@example.com" }
]
keywords = ["structural-engineering", "truss", "finite-element", "2d", "mechanics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "isort>=5.12",
]

[project.scripts]
truss-analyze = "truss_analysis.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 130
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff.lint]
ignore = ["PLR2004"]

[tool.ruff]
line-length = 130
target-version = "py38"

select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped", "attr-defined", "operator", "arg-type", "assignment", "union-attr", "var-annotated", "return", "list-item", "index", "name-defined"]

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true