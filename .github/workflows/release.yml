name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Generate Release Notes
        run: |
          echo "## Release Notes / یادداشت‌های انتشار" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🇬🇧 English" >> RELEASE_NOTES.md
          echo "Automated release of version ${GITHUB_REF_NAME#v}." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🇮🇷 فارسی" >> RELEASE_NOTES.md
          echo "انتشار خودکار نسخه ${GITHUB_REF_NAME#v}." >> RELEASE_NOTES.md
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
