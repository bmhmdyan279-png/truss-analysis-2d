name: Publish to PyPI
on:
  # Manual-only: publishing must be an explicit action (prevents accidental
  # releases from tag pushes).  Dispatch on a TAG ref (e.g. v2.10.1), not on
  # a branch: setuptools_scm derives the version from the checkout, so a
  # branch dispatch builds a `X.Y.Z.devN+gSHA` local version, which PyPI
  # rejects at the upload step after a full build — a confusing late
  # failure that the guard below turns into an immediate, explained one.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write  # Mandatory for Trusted Publishing (OIDC)
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Require a tag dispatch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Publish was dispatched on '${REF}' (a ${REF_TYPE}). Dispatch this workflow on a tag ref such as v2.10.1 — a branch checkout builds a dev/local version that PyPI rejects at upload time."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install build
      - run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # NO user/password! Trusted Publishing handles auth via OIDC.
