name: Deploy documentation

on:
  # Manual-only, matching publish.yml and release.yml: deploying the docs
  # site is an explicit act, not a side effect of pushing to main.
  # Requires Pages enabled with "Source: GitHub Actions" (Settings -> Pages);
  # configure-pages below attempts the enablement when the token allows it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the documented version from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with the docs extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build HTML documentation
        # Deliberately not -W (warnings-as-errors): the api/ stubs are
        # autosummary-generated and a first deployment should not fail on a
        # nitpick. Tighten once the build is warning-clean in CI.
        run: sphinx-build -b html docs docs/_build/html
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
