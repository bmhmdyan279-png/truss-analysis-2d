name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install linters
        run: python -m pip install --upgrade pip && pip install ruff==0.16.6
      # Every Python directory in the repo, matching the pre-commit chain and
      # `make lint`. benchmarks/ and docs/ were previously excluded, which is
      # how 240 findings stayed invisible on main while pre-commit was red.
      - name: Ruff check
        run: ruff check src tests scripts benchmarks docs
      - name: Ruff format check
        run: ruff format --check src tests scripts benchmarks docs

  type:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Install reference-solver extra (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: pip install -e ".[validation]"
      - name: Install tomli for Python 3.10
        if: matrix.python-version == '3.10'
        run: pip install tomli
      - name: Pytest
        run: >
          pytest tests/ -q --no-header
          --ignore=tests/validation/test_level4_opensees.py
          --ignore=tests/validation/test_level4_rho_branches.py
          --ignore=tests/validation/test_level5_crossval.py

  coverage:
    name: Coverage gate (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,validation]"
      - name: Pytest with coverage
        run: >
          pytest tests/ -q --no-header
          --cov=src
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=90
          --ignore=tests/validation/test_level4_opensees.py
          --ignore=tests/validation/test_level4_rho_branches.py
          --ignore=tests/validation/test_level5_crossval.py

  reference-solver:
    name: Reference-solver bridge (mandatory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The three files the canonical stats configuration ignores are the ones
    # that need a reference solver the other runners do not have.  Ignoring
    # them from the *statistics* is correct -- the published test count must be
    # the same number on every machine -- but ignoring them from *every job*
    # meant the cross-validation column of the verification matrix was never
    # enforced anywhere.  `physics_boundary` ships a digest of that evidence in
    # `solver_metadata`, so a claim was traveling in the payload that no gate
    # checked.  This job is the gate: same three files, run unconditionally,
    # failing the build if the bridge breaks.
    #
    # OpenSeesPy on Linux dynamically links against the system BLAS/LAPACK
    # shared objects (`libblas.so.3`, `liblapack.so.3`).  The ubuntu-latest
    # runner does not ship them in the linker's default search path, so the
    # installation and import steps below must not run before they are
    # provisioned.  On Ubuntu 24.04 the -dev packages drop the versioned .so.3
    # under /usr/lib/x86_64-linux-gnu/{blas,lapack}/, which the linker still
    # cannot see, hence the explicit symlinks into the default directory.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install system dependencies for OpenSeesPy
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev
      - name: Expose versioned BLAS/LAPACK on the linker's default path
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/blas/libblas.so.3 \
                      /usr/lib/x86_64-linux-gnu/libblas.so.3
          sudo ln -sf /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3 \
                      /usr/lib/x86_64-linux-gnu/liblapack.so.3
      - name: Install package with the reference-solver extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]"
      - name: Confirm the reference solver actually imported
        run: |
          python -c "
          import openseespy.opensees as o
          v = getattr(o, 'getVersion', None) or getattr(o, 'pyversion', None)
          assert v is not None, 'no version attribute found on openseespy.opensees'
          print('opensees', v)
          "
      - name: Run the reference-solver bridge
        run: >
          pytest
          tests/validation/test_level4_opensees.py
          tests/validation/test_level4_rho_branches.py
          tests/validation/test_level5_crossval.py
          -q --no-header -p no:randomly --no-cov -rs

  stats:
    name: README statistics gate (make stats)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,validation]"
      # Deliberately lets the script do its own measuring rather than parsing
      # the coverage job's output in shell.  `--check` and `make stats` then
      # share one parser, so a green gate here guarantees `make stats` would
      # be a no-op -- which is the actual property being asserted.  Two
      # independent parsers could each be right and still disagree.
      - name: Check the README files quote the measured suite
        run: python scripts/update_readme_stats.py --check

  build-sdist:
    name: Build sdist + wheel (incl. git-less export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade pip && pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Build sdist from a git-less export (fallback version)
        run: |
          mkdir -p /tmp/export
          git archive HEAD | tar -x -C /tmp/export
          cd /tmp/export
          python -m build --sdist
          python -m twine check dist/*

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build image
        run: docker build -t truss-analysis:ci .
      - name: Run default smoke command
        run: docker run --rm truss-analysis:ci
