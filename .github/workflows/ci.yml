name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: python -m pip install --upgrade pip && pip install ruff==0.16.6
      # Every Python directory in the repo, matching the pre-commit chain and
      # `make lint`. benchmarks/ and docs/ were previously excluded, which is
      # how 240 findings stayed invisible on main while pre-commit was red.
      - name: Ruff check
        run: ruff check src tests scripts benchmarks docs
      - name: Ruff format check
        run: ruff format --check src tests scripts benchmarks docs

  type:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Install reference-solver extra (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: pip install -e ".[validation]"
      - name: Install tomli for Python 3.10
        if: matrix.python-version == '3.10'
        run: pip install tomli
      - name: Pytest
        run: >
          pytest tests/ -q --no-header
          --ignore=tests/validation/test_level4_opensees.py
          --ignore=tests/validation/test_level4_rho_branches.py
          --ignore=tests/validation/test_level5_crossval.py

  coverage:
    name: Coverage gate (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,validation]"
      - name: Pytest with coverage
        run: >
          pytest tests/ -q --no-header
          --cov=src
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=90
          --ignore=tests/validation/test_level4_opensees.py
          --ignore=tests/validation/test_level4_rho_branches.py
          --ignore=tests/validation/test_level5_crossval.py

  stats:
    name: README statistics gate (make stats)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,validation]"
      # Deliberately lets the script do its own measuring rather than parsing
      # the coverage job's output in shell.  `--check` and `make stats` then
      # share one parser, so a green gate here guarantees `make stats` would
      # be a no-op -- which is the actual property being asserted.  Two
      # independent parsers could each be right and still disagree.
      - name: Check the READMEs quote the measured suite
        run: python scripts/update_readme_stats.py --check

  build-sdist:
    name: Build sdist + wheel (incl. git-less export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade pip && pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Build sdist from a git-less export (fallback version)
        run: |
          mkdir -p /tmp/export
          git archive HEAD | tar -x -C /tmp/export
          cd /tmp/export
          python -m build --sdist
          python -m twine check dist/*

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t truss-analysis:ci .
      - name: Run default smoke command
        run: docker run --rm truss-analysis:ci
