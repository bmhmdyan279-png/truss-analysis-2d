schema: truss-analysis/physics-boundary/v1

# Machine-readable form of the Physics Boundary table in docs/theory.md §12.
#
# The prose table answers "what is this solver?" for a reader.  This file
# answers it for a *program*: a result can carry the boundary it was computed
# under, a test can assert the boundary has not silently changed, and a
# downstream consumer can refuse an analysis whose envelope does not cover its
# use.  Prose cannot do any of those three things, which is why round-6 audit
# item C13 asked for it.
#
# Single source of truth: this file.  docs/theory.md §12 is the human rendering
# of the same list and tests/test_physics_boundary.py asserts the two agree on
# id, status and doc section, so the table in the documentation cannot drift
# away from the artefact that ships in the wheel.

version: "2.9.0"
updated: "2026-09-16"
audit_round: 6

status_vocabulary:
  exact: "Solved to numerical tolerance with a closed-form or independent-oracle verification."
  supported: "Modelled and verified; no stated restriction beyond the module's scope notes."
  supported-with-limits: "Modelled and verified, but with an explicit validity restriction that a caller must respect."
  not-supported: "Not modelled. Requesting it silently would be a wrong answer, so it is declared absent."
  deferred: "Intended but not yet implemented, with the reason recorded in the CHANGELOG."

entries:
  - id: linear_truss_statics
    phenomenon: "Linear truss statics (small displacement)"
    status: exact
    detail: "Direct stiffness method, pin-jointed, nodal loads only."
    doc_section: "1"

  - id: eigenstrain_thermal_fabrication
    phenomenon: "Thermal / fabrication eigenstrain"
    status: supported
    detail: "Verified in both the restrained and the free-expansion limits."
    doc_section: "1.3"

  - id: temperature_dependent_material
    phenomenon: "Temperature-dependent E(theta), f_y(theta)"
    status: supported
    detail: "EN 1993-1-2 Table 3.1, loaded from the provenance fixture; no hard-coded material numbers."
    doc_section: "4"

  - id: secant_thermal_strain
    phenomenon: "Secant thermal strain alpha_bar(theta_0, theta)"
    status: supported
    detail: "Opt-in via effective_alpha; guards against the constant-alpha trap."
    doc_section: "10.3"

  - id: fire_exposure_unprotected
    phenomenon: "Fire exposure to member temperature, unprotected steel"
    status: supported-with-limits
    detail: >-
      ISO 834 or Annex A parametric exposure, EN 1993-1-2 4.2.2.2 lumped
      capacitance.  Limit: the cross-section temperature is UNIFORM.  Validity
      is measured, not assumed -- the Biot number is derived from the module's
      own heat-transfer physics and a LumpedCapacityWarning fires below
      A_m/V = 50 1/m, where a real through-thickness gradient develops and a
      single lumped temperature becomes un-conservative.
    doc_section: "10.2, 10.6"
    limits:
      - "uniform cross-section temperature (no heat conduction through the section)"
      - "A_m/V >= 50 1/m for the lumped assumption to be comfortable"

  - id: fire_exposure_parametric
    phenomenon: "Parametric (natural) fire curves"
    status: supported-with-limits
    detail: >-
      EN 1991-1-2 Annex A main clause, derived from opening factor, fire load
      density, boundary thermal inertia and the Table A.2 limiting duration.
      Pinned against the Access Steel worked example SX042a-EN-EU.
    doc_section: "10.4"
    limits:
      - "0.02 <= O <= 0.2 m^0.5 and 100 <= b <= 2200 J/(m^2 s^0.5 K) enforced"
      - "q_td outside [50, 1000] MJ/m^2 warns as an extrapolation"
      - "the A.1(1)-note office variant Gamma = (b/1160)^2/(q_td/420)^2 is NOT implemented"

  - id: fire_exposure_protected
    phenomenon: "Fire exposure to member temperature, protected / insulated steel"
    status: supported-with-limits
    detail: >-
      EN 1993-1-2 clause 4.2.5.2 recursion with the mu capacity ratio, the
      non-negativity clip and the 30 s step ceiling.  Deliberately integrated
      by explicit Euler rather than RK4: the clause states a recursion, and a
      fire-resistance duration quoted against a different integrator than the
      code's is not a code-compliant duration.
    doc_section: "10.5"
    limits:
      - "one homogeneous insulation layer; no cavity, no multi-layer build-up"
      - "constant lambda_p, rho_p, c_p -- gypsum's dehydration plateau near 100-200 degC is NOT represented"
      - "no intumescent coatings (effective thickness is temperature- and time-dependent)"
      - "shipped material catalogue is representative literature data, not certified product data"

  - id: fire_resistance_prescribed
    phenomenon: "Fire resistance at a prescribed temperature"
    status: supported
    detail: "EN 1993-1-2 4.2.3.1 chi model, fire and ambient buckling curves."
    doc_section: "4"

  - id: member_buckling_capacity
    phenomenon: "Member buckling capacity"
    status: supported-with-limits
    detail: "Flexural buckling only, Euler or code chi."
    doc_section: "4"
    limits:
      - "torsional and torsional-flexural buckling need I_z, I_t, I_w, which the section model does not carry"

  - id: system_bifurcation
    phenomenon: "System bifurcation under prestress"
    status: supported-with-limits
    detail: >-
      Linearised eigenvalue analysis about the prestressed base state, dense or
      sparse Lanczos path, agreement < 2e-13 relative between them.
    doc_section: "9"
    limits:
      - "linearised: for shallow systems the true collapse is a snap-through limit point"
      - "ShallowSystemWarning below a depth/span ratio of 0.1"

  - id: imperfection_sensitivity
    phenomenon: "Imperfection sensitivity of the bifurcation load"
    status: supported-with-limits
    detail: >-
      Linearised sweep over imposed geometric imperfections along the critical
      mode, both signs probed and the adverse one reported.
    doc_section: "9.5"
    limits:
      - "each point is a fresh linearised analysis, not a limit-point search"

  - id: tangent_linearization_gap
    phenomenon: "Accuracy of the first-order tangent K_E + K_G"
    status: supported-with-limits
    detail: >-
      Measured rather than asserted: verify_linearization_convergence reports
      that the relative Frobenius gap to the exact tangent closes at fitted
      order 1.000 over a 16x load range.
    doc_section: "tangent_verification"
    limits:
      - "first order in the demand; large-displacement response is out of scope"

  - id: reliability_crude
    phenomenon: "Reliability: crude Monte Carlo, LHS, rank correlation"
    status: supported-with-limits
    detail: >-
      Iman-Conover rank reordering preserves LHS stratification exactly, and
      the achieved Spearman correlation is reported alongside the target.
      Parallel evaluation is bit-identical to serial.
    doc_section: "11"
    limits:
      - "pf below ~1/n cannot be resolved by crude Monte Carlo; the Clopper-Pearson interval, not the point estimate, is the honest output"
      - "beta_mom is a method-of-moments mean/std, NOT a Hasofer-Lind / FORM index"

  - id: thermal_conduction_through_section
    phenomenon: "Thermal transient conduction through the cross-section"
    status: not-supported
    detail: "Uniform section temperature only; validity is measured via the Biot number instead."
    doc_section: "10.6"

  - id: geometric_nonlinearity
    phenomenon: "Geometric nonlinearity (P-delta, large displacement)"
    status: not-supported
    detail: "Validity guarded by LargeDisplacementWarning and diagnosable via the bifurcation analysis."
    doc_section: "9.3"

  - id: post_buckling
    phenomenon: "Post-buckling, snap-through, arc-length continuation"
    status: not-supported
    detail: "Supersedes rather than extends the linearised bifurcation check; belongs to a dedicated release."
    doc_section: "9.3, 9.5"

  - id: material_nonlinearity
    phenomenon: "Material nonlinearity (plasticity, redistribution)"
    status: not-supported
    detail: "Capacity checks are code-model, not incremental analysis."
    doc_section: "4"

  - id: creep_transient_strain
    phenomenon: "Creep & transient thermal strain"
    status: deferred
    detail: "Needs material data and validation sources beyond the current fixture."
    doc_section: "12"

  - id: torsional_buckling
    phenomenon: "Torsional / torsional-flexural buckling"
    status: not-supported
    detail: "Requires I_z, I_t and I_w, which the section model does not carry."
    doc_section: "12"

  - id: model_dimensionality
    phenomenon: "3D, frames, semi-rigid joints, distributed loads"
    status: not-supported
    detail: "2D pin-jointed assemblies with nodal loads only."
    doc_section: "1"

  - id: rare_event_reliability
    phenomenon: "FORM/SORM, PCE, Sobol indices, subset simulation"
    status: deferred
    detail: "A UQ subsystem with its own validation burden."
    doc_section: "11.2"

  - id: empirical_validation
    phenomenon: "Validation against physical fire or structural test data"
    status: not-supported
    detail: >-
      Verification is against closed forms, independent algorithms and code
      worked examples.  No experimental corpus is shipped, so agreement with
      the real world is inferred from agreement with the standards, not
      measured.
    doc_section: "12"
